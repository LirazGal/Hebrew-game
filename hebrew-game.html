  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; }
    .game-root {
      min-height: 100vh;
      background: #FFF8EE;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255,180,100,0.18) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(100,180,255,0.15) 0%, transparent 50%);
    }
    .card {
      background: white;
      border-radius: 28px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
    }
    .btn-option {
      background: white;
      border: 3px solid #F0E8FF;
      border-radius: 18px;
      padding: 16px 20px;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: all 0.15s ease;
      font-family: 'Nunito', sans-serif;
    }
    .btn-option:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: #C4A5FF;
      box-shadow: 0 6px 20px rgba(130,80,220,0.15);
    }
    .btn-option:disabled { cursor: default; }
    .btn-option.correct { background: #D4F5E9; border-color: #52C99A; }
    .btn-option.wrong { background: #FFE4E4; border-color: #F87171; }
    .btn-option.dimmed { opacity: 0.5; }
    .progress-bar { height: 12px; background: #F0E8FF; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #A78BFA, #7C3AED); border-radius: 99px; transition: width 0.4s ease; }
    .levelup-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 998;
      animation: fadeIn 0.3s ease;
    }
    .levelup-card {
      background: white; border-radius: 32px;
      padding: 40px 48px; text-align: center;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .lb-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #F5F0FF;
    }
    .lb-row:last-child { border-bottom: none; }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>

    /* ── Leaderboard (Firestore) ── */
    const DEFAULT_LB = [
      { name: "Sofia", score: 220 },
      { name: "Miguel", score: 180 },
      { name: "Carmen", score: 130 },
    ];
    function waitForLB() {
      if (window._lb) return Promise.resolve(window._lb);
      return new Promise(r => window.addEventListener('lb-ready', () => r(window._lb), { once: true }));
    }
    function mergeBoard(rows) {
      return [...rows, ...DEFAULT_LB].sort((a, b) => b.score - a.score).slice(0, 10);
    }
    async function fetchBoard() {
      try {
        const lb = await waitForLB();
        const q = lb.query(lb.collection(lb.db, 'leaderboard'), lb.orderBy('score', 'desc'), lb.limit(10));
        const snap = await lb.getDocs(q);
        const rows = snap.docs.map(d => ({ name: d.data().name, score: d.data().score }));
        return mergeBoard(rows);
      } catch (e) { console.error('leaderboard read failed', e); return mergeBoard([]); }
    }
    async function submitScore(name, score) {
      try {
        const lb = await waitForLB();
        await lb.addDoc(lb.collection(lb.db, 'leaderboard'), { name, score, ts: lb.serverTimestamp() });

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

      const base = pool.filter(i => i.hebrew !== correct.hebrew);

      return shuffle([correct, ...wrong]);
    }

    function FireworkCanvas({ active }) {
      const canvasRef = useRef(null);
      const animRef = useRef(null);
      const particlesRef = useRef([]);
      useEffect(() => {
        if (!active) { particlesRef.current = []; return; }
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const colors = ["#FF6B6B","#FFD93D","#6BCB77","#4ECDC4","#FF6FC8","#A78BFA","#FB923C"];
        particlesRef.current = [];
        for (let b = 0; b < 6; b++) {
          const cx = 100 + Math.random() * (canvas.width - 200);
          const cy = 80 + Math.random() * (canvas.height * 0.5);
          for (let i = 0; i < 30; i++) {
            const angle = (Math.PI * 2 * i) / 30;
            const speed = 2 + Math.random() * 4;
            particlesRef.current.push({ x: cx, y: cy, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, alpha: 1, color: colors[Math.floor(Math.random()*colors.length)], size: 3+Math.random()*4 });
          }
        }
        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particlesRef.current.forEach(p => { p.x+=p.vx; p.y+=p.vy+0.05; p.vy+=0.05; p.alpha-=0.018; ctx.globalAlpha=Math.max(0,p.alpha); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); });
          ctx.globalAlpha = 1;
          particlesRef.current = particlesRef.current.filter(p => p.alpha > 0);
          if (particlesRef.current.length > 0) animRef.current = requestAnimationFrame(animate);
        };
        animRef.current = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(animRef.current);
      }, [active]);
      if (!active) return null;
      return <canvas ref={canvasRef} style={{ position:"fixed", top:0, left:0, pointerEvents:"none", zIndex:999 }} />;
    }

            {question && (
              <div className="card" style={{ width:"100%", maxWidth:460, padding:"32px 20px", textAlign:"center", marginBottom:20 }}>
                <div style={{ fontSize:110, lineHeight:1.1, filter:"drop-shadow(0 4px 12px rgba(0,0,0,0.12))" }}>{question.emoji}</div>
                <p style={{ color:"#C4B5FD", fontSize:13, marginTop:16, fontWeight:700 }}>מה זה?</p>
              </div>
            )}

            <div style={{ width:"100%", maxWidth:460, display:"flex", flexDirection:"column", gap:12 }}>
              {options.map((opt, i) => {
                let cls = "btn-option";
                if (selected) {
                  if (opt.hebrew === question.hebrew) cls += " correct";
                  else if (opt.hebrew === selected) cls += " wrong";
                  else cls += " dimmed";
                }
                return (
                  <button key={i} className={cls} onClick={() => handleAnswer(opt)} disabled={!!selected}>
                    <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:12 }}>
                      <div>
                        <div style={{ fontFamily:"'Fredoka One',cursive", fontSize:24, color:"#1F2937", direction:"rtl" }}>{opt.hebrew}</div>
                        <div style={{ fontSize:14, color:"#9CA3AF", fontWeight:600, marginTop:1 }}>{opt.phonetic}</div>
                      </div>
                      {selected && opt.hebrew === question.hebrew && <span style={{ fontSize:22 }}>✅</span>}
                      {selected && opt.hebrew === selected && opt.hebrew !== question.hebrew && <span style={{ fontSize:22 }}>❌</span>}
                    </div>
                  </button>
                );
              })}
            </div>

            <p style={{ color:"#D8B4FE", fontSize:12, marginTop:16, fontWeight:600 }}>{totalAnswered} שאלות עד עכשיו</p>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
